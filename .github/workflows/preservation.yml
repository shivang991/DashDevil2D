name: Long Drive preservation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - run: npm install --global pnpm@8.15.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:generated
      - run: pnpm check
      - run: pnpm --filter @dashdevil/client exec playwright install --with-deps chrome ffmpeg
      - run: pnpm test:browser
      - run: pnpm test:transport
      - run: pnpm test:rooms
      - run: pnpm test:race
      - run: pnpm test:objects
      - run: pnpm test:contacts
      - run: pnpm test:hearts
      - run: pnpm test:lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/client/test-results
